name: Bug Report
description: Report a bug, crash, or unexpected behavior in gomod123
labels: [ "bug" ]
body:
  - type: dropdown
    id: loader
    attributes:
      label: Client / Mod Loader
      options:
        - Minecraft Forge 1.8.9
        - Lunar Client (Weave 1.3.4)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: gomod123 Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open gomod menu...
        2. Enable module...
        3. Join a Blitz SG game...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Crash Report / Relevant Logs (optional)
      description: Paste any relevant lines from latest.log or a crash report.
      render: text
