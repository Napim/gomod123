name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  forge:
    name: Build Forge 1.8.9
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"
          cache: gradle

      - name: Build & verify Forge public JAR
        run: |
          chmod +x gradlew
          ./gradlew clean build -PpublicRelease=true --console=plain --stacktrace

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: gomod123-forge
          path: |
            build/libs/gomod123-forge-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  weave:
    name: Build Lunar Weave 1.3.4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8 (Weave compile toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"

      - name: Set up Java 21 (Gradle runtime for Weave)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build & test Weave public JAR
        working-directory: weave
        run: |
          chmod +x gradlew
          ./gradlew clean build -PpublicRelease=true --console=plain --stacktrace

      - name: Upload Lunar Weave JAR
        uses: actions/upload-artifact@v4
        with:
          name: gomod123-lunar
          path: weave/build/libs/gomod123-lunar-*.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [ forge, weave ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Forge JAR
        uses: actions/download-artifact@v4
        with:
          name: gomod123-forge
          path: release-assets

      - name: Download Lunar Weave JAR
        uses: actions/download-artifact@v4
        with:
          name: gomod123-lunar
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.jar
